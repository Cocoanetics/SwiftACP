---
# Throwaway: proves WindowsTerminalTests catch each sabotage in sabotage/*.patch (#280).
name: Swift
on:
  pull_request:
    branches:
      - main
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sabotage-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sabotage: [detached-shell, kill-and-shell]
    steps:
      - uses: actions/checkout@v6
      - name: Setup Swift
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: "6.3.1"
      - name: Sabotage
        shell: bash
        run: git apply "sabotage/${{ matrix.sabotage }}.patch" && git diff --stat
      - name: Build
        run: swift build --build-tests --disable-default-traits
      - name: Test
        run: swift test --skip-build --disable-default-traits --filter WindowsTerminalTests
